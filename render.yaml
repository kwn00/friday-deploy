# Render Blueprint: 게임 화면 + API + 실시간 서버를 웹 서비스 하나로 배포한다.
# 사용법: Render 대시보드 → New → Blueprint → 이 저장소 선택 → Apply.
# 이후 main 브랜치에 푸시할 때마다 자동으로 다시 배포된다 (배포 순간 진행 중인 판은 끊긴다).
# 아래 buildFilter 의 파일만 바뀐 푸시는 다시 배포하지 않는다.
services:
  - type: web
    name: friday-deploy
    runtime: node
    # 무료: 15분 동안 접속이 없으면 잠들고, 다음 접속 때 깨는 데 약 1분. 월 전송량 5GB (워크스페이스 전체).
    # 상시 실행이 필요해지면 plan 만 starter 로 바꾸면 된다.
    plan: free
    # 한국에서 가장 가까운 Render 리전. 서비스를 만든 뒤에는 바꿀 수 없다.
    region: singapore
    branch: main
    # 클라이언트 빌드에 Vite(개발 의존성)가 필요하므로 NODE_ENV 와 상관없이 dev 의존성까지 설치한다.
    buildCommand: npm ci --include=dev && npm run build
    # npm start 를 거치지 않고 node 를 직접 띄운다 (exec: 셸이 node 로 바뀌어, 감싸는 프로세스 없이 node 가 신호를 직접 받는다.
    # tsx 가 TypeScript 를 바꿀 때 esbuild 도우미를 하나 띄울 수 있는데(캐시가 있으면 띄우지 않는다), node 가 끝나면 함께 끝난다).
    # 예전 startCommand 였던 npm start 는 npm → sh → npm → sh → tsx → node 로 이어졌다 (지금도 npm 과 sh 가 감싼다). 바깥 npm 에 SIGTERM(배포·재시작 때의 종료 신호)을
    # 보내면 바깥 npm 만 끝나고 안쪽 서버(node)는 신호를 받지 못한 채 남는다: 결국 강제로 꺼져서 종료 처리(아직 저장하지
    # 못한 리더보드 기록·통계를 마저 쓰기)가 돌지 않는다. 감싸는 프로세스들이 쓰던 메모리도 아낀다 (로컬에서 재어 합계 약 230MB → 100MB).
    # TypeScript 는 tsx 를 node 의 --import 로 불러 그대로 실행한다 (apps/server 의 npm start 와 같은 방식).
    startCommand: cd apps/server && NODE_ENV=production exec node --import tsx src/index.ts
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    # 게임 서버와 화면에 들어가지 않는 파일만 바뀐 커밋은 다시 배포하지 않는다 (배포하면 진행 중인 판이 끊긴다):
    # 문서, 테스트, GitHub 워크플로, Claude 스킬, 환경 변수 예시, 화면만 따로 올릴 때의 Vercel 설정, .gitignore.
    # render.yaml 은 빼지 않는다 (시작 명령 등이 바뀌면 다시 배포해야 한다).
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - "docs/**"
        - "**/*.test.ts"
        - ".github/**"
        - ".claude/**"
        - ".env.example"
        - "vercel.json"
        - ".gitignore"
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 세션 토큰과 결과 서명용 HMAC 시크릿. Render 가 처음 한 번 무작위로 만들고 이후 유지한다.
      - key: SESSION_SECRET
        generateValue: true
      # Render 는 들어온 X-Forwarded-For 뒤에 덧붙이기만 해서 맨 앞 값을 위조할 수 있다.
      # Render 앞단(Cloudflare)이 덮어쓰는 단일 값 헤더로 클라이언트 IP 를 읽는다.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # 리더보드 기록을 유지하려면 Render 대시보드의 Environment 에서 DATABASE_URL (PostgreSQL 주소)을 직접 추가한다.
      # 비밀번호가 들어 있으므로 이 파일에는 적지 않는다. 없으면 기록은 서버 메모리에만 있다 (README 참고).
